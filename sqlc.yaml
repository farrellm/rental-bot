# sqlc generates the query layer from migrations/ and internal/store/queries/.
#
# The generated code is committed, so a fresh clone builds and `make check`
# runs without sqlc installed. `make generate` regenerates it and skips with an
# install hint when the tool is absent, the same way `make lint` treats
# staticcheck. Regenerate whenever a migration or a query file changes.
version: "2"
sql:
  - engine: "sqlite"
    schema: "migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        # A nullable column becomes *T rather than sql.NullT, so a PATCH that
        # clears a field and a PATCH that omits it stay distinguishable all the
        # way down to the write.
        emit_pointers_for_null_types: true
        # A query that matched nothing returns [] rather than nil, so the JSON
        # is an empty array instead of null.
        emit_empty_slices: true
        overrides:
          # Money is domain.Money in the database, in Go, and on the wire
          # (docs/DESIGN.md §3). The override keeps that true at the store
          # boundary rather than converting an int64 back into it by hand at
          # every call site.
          #
          # pointer follows nullability: a nullable money column stays *Money so
          # "unknown" and "zero" remain different claims, and a NOT NULL one is
          # a plain Money that no call site has to dereference.
          - column: "properties.purchase_price_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          - column: "transactions.amount_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
          - column: "repairs.estimate_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          - column: "repairs.actual_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          - column: "leases.rent_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
          - column: "leases.deposit_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          - column: "leases.late_fee_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          # M4's tables. Every one of these is nullable, because a declaration
          # page that does not state a deductible and one that states zero are
          # different claims and the record keeps them apart.
          - column: "insurance_policies.annual_premium_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          - column: "insurance_policies.dwelling_coverage_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          - column: "insurance_policies.liability_coverage_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          - column: "insurance_policies.deductible_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          - column: "mortgages.original_principal_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          - column: "mortgages.monthly_pi_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          - column: "mortgages.escrow_monthly_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          - column: "mortgages.current_balance_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          - column: "mortgage_statements.principal_balance_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          - column: "mortgage_statements.payment_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          - column: "mortgage_statements.principal_paid_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          - column: "mortgage_statements.interest_paid_cents"
            go_type:
              import: "github.com/farrellm/rental-bot/internal/domain"
              type: "Money"
              pointer: true
          - column: "mortgage_statements.escrow_paid_cents"
            go_type:
