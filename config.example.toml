# rental-bot configuration.
#
# Copy to config.toml and edit, or leave it out entirely — every value below
# is a default and every one can be overridden with an environment variable
# named RENTAL_BOT_<SECTION>_<KEY>, e.g. RENTAL_BOT_SERVER_ADDR=:9000.
#
# Secrets are never read from this file. See the bottom of this file.

[server]
# Listen address. Put Caddy in front of this for TLS; Pub/Sub push requires a
# valid public HTTPS endpoint.
addr = ":8082"
# The origin the operator reaches the app on. Deep links in email replies and
# Telegram messages are built from it.
base_url = "http://localhost:8082"

[database]
# SQLite file. Its parent directory is created at startup if missing.
path = "data/rental.db"
# Reader connections. Writes serialize on a single connection no matter what
# this is set to — see docs/DESIGN.md §2.
read_pool_size = 4

[storage]
# Content-addressed blob store and the raw .eml archive.
blobs = "data/blobs"
raw_email = "data/raw-email"
# Where an alert waits when it could not be delivered as it was raised. A
# critical alert cannot ride the job queue — the queue is one of the things it
# reports on — so it goes to disk and is drained on the next attempt.
spool = "data/spool"
# The largest document that can be uploaded, in bytes. The cap is applied to
# the request body, so anything past it is refused before it reaches the disk.
max_upload_bytes = 26214400 # 25 MiB

[gmail]
# Email ingestion. A blank client_id is the off switch: the process runs
# without a Google project, and the intake screen says so rather than
# pretending to be disconnected. Set it and everything below is required.
#
# The OAuth client is a "Web application" client with
# <base_url>/api/v1/gmail/callback as an authorized redirect URI.
client_id = ""
# The Pub/Sub topic users.watch publishes to. Grant
# gmail-api-push@system.gserviceaccount.com the Publisher role on it, and point
# a push subscription at <base_url>/webhooks/gmail.
topic = ""
# Only mail from these addresses is processed. Everything else is labelled and
# stored `ignored` — a public-ish inbox will receive spam, and this is the
# first and cheapest defense.
allowed_senders = []
# Labels applied in Gmail, so the mailbox shows what this process did.
processed_label = "rental-bot/processed"
ignored_label = "rental-bot/ignored"
# The fallback poller's period. This, and not the webhook, is what makes
# ingestion reliable: Pub/Sub is at-least-once and occasionally lossy, and a
# watch can lapse silently. Every step is idempotent, so the overlap is free.
poll_interval = "10m"
# Google expires a watch after 7 days. Daily renewal leaves six days of
# failures before anything is actually lost.
watch_renew_interval = "24h"
# The largest attachment that will be downloaded. Anything past it is recorded
# with the reason and skipped, rather than silently dropped.
max_attachment_bytes = 26214400 # 25 MiB

[gmail.pubsub]
# What an incoming push has to prove. The push carries an OIDC JWT and nothing
# else worth trusting; both of these have to match or the request is refused.
audience = ""
service_account = ""

[telegram]
# The alert channel. A blank bot_username is the off switch: the process runs
# without a bot, and the intake screen says it is not set up rather than
# pretending nobody has paired. Set it and everything below is required.
#
# Talk to @BotFather to create a bot; it gives you the username and the token.
# The token goes in the environment, not here.
bot_username = ""
# How long a condition stays quiet after it has been reported. An alert channel
# noisy enough to be muted is worse than no channel at all.
cooldown = "6h"
# The same for critical alerts, which are worth restating sooner. It cannot be
# longer than cooldown — that would restate a critical condition less often
# than an ordinary one.
critical_cooldown = "1h"
# How long a pairing code is good for. It is single-use and shown once, in the
# log and on the intake screen.
pairing_ttl = "10m"
# The getUpdates long-poll timeout. Telegram holds the request open for it and
# closes it at 50s regardless, so this is not a busy loop's period.
poll_interval = "30s"
# How often the probes run: how late a condition nobody publishes an event for
# — a lapsed watch, a queue backlog — is noticed.
sweep_interval = "5m"
# How many pending jobs is too many. 0 turns the check off.
queue_backlog_threshold = 50
# How long a connected mailbox may go unchecked before that is worth saying out
# loud. This measures the poll, not the mail: a quiet week is normal, a poller
# that stopped running is not.
silence_after = "48h"

[jobs]
# The worker pool draining the jobs table. Writes serialize on one SQLite
# connection regardless, so this bounds overlapping network calls rather than
# database throughput.
workers = 2
poll_interval = "5s"
# How long a claimed job may stay locked before the runner assumes the worker
# holding it is gone and returns it to pending.
lease_timeout = "10m"

[log]
# debug | info | warn | error
level = "info"
# text | json — json for the systemd unit, text at a terminal.
format = "text"

# Secrets come from the environment, never from here:
#
#   RENTAL_BOT_SECRET_KEY          the AES-GCM key protecting encrypted columns
#   RENTAL_BOT_SECRET_KEY_FILE     a path to that key; the file must be mode 0600
#   RENTAL_BOT_GMAIL_CLIENT_SECRET the OAuth client secret
#   RENTAL_BOT_TELEGRAM_BOT_TOKEN  the bot token from @BotFather
#
# The encryption key is required once gmail.client_id is set: the refresh token
# is stored encrypted, so a database copy without the key does not hand over
# the mailbox.
#
# The bot token is not stored anywhere. Leaking it grants the ability to send
# *as* the bot, not to command it — authorization is the stored chat_id, and
# re-pairing needs server access.
#
# Setting a [secrets] table in this file has no effect.
